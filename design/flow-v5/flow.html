<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ditch onboarding v5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#F5F5F7;--fill:#F2F2F7;--sep:#E5E5EA;--l:#0A0A0A;--l2:#3C3C43;--l3:#6E6E73;--ph:#8E8E93;--acc:#0B7A6E;--accFill:#0B9E8F;--tint:#E6F4F1;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#E9E9EE;font-family:Inter,-apple-system,'SF Pro Text',system-ui,sans-serif;color:var(--l);letter-spacing:-.2px}
body.board{background:#ECECF1}
.stage{display:flex;gap:40px;padding:40px;flex-wrap:wrap;justify-content:center}
.phone{width:393px;height:852px;background:var(--bg);border-radius:54px;position:relative;overflow:hidden;box-shadow:0 0 0 10px #111,0 30px 60px rgba(0,0,0,.18);flex:none}
.cap{font:600 15px Inter,sans-serif;color:#3C3C43;text-align:center;margin-top:22px}
.cell{display:flex;flex-direction:column;align-items:center}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;font-weight:600;font-size:17px;z-index:5}
.sb .isl{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px}
.sb svg{display:block}
.hi{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#0A0A0A;z-index:5}
.scr{position:absolute;inset:0;padding:54px 24px 34px;display:flex;flex-direction:column}
.top{height:44px;display:flex;align-items:center;gap:10px;flex:none}
.back{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer}
.prog{flex:1;display:flex;gap:6px;margin-right:2px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--fill)}.prog i.on{background:var(--l)}
.title{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.6px;margin:16px 0 0}
.body{font-size:17px;line-height:24px;color:var(--l2);margin:12px 0 0}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;flex:none}
.cta{height:56px;border-radius:28px;background:var(--l);color:#fff;font:600 17px Inter,sans-serif;letter-spacing:-.3px;border:0;width:100%;cursor:pointer}
.cta.off{background:var(--surface);color:var(--l)}
.sec{height:44px;border:0;background:none;font:600 17px Inter,sans-serif;color:var(--l2);letter-spacing:-.3px;cursor:pointer;width:100%}
.fine{font-size:13px;line-height:18px;color:var(--l3);text-align:center}
.logo{width:40px;height:40px;border-radius:9px;box-shadow:0 0 0 .5px rgba(0,0,0,.1);flex:none;display:block}
.money{font-variant-numeric:tabular-nums}
/* 1 welcome */
.deck{position:relative;height:330px;margin:60px -24px 0}
.card{position:absolute;left:50%;width:330px;height:76px;margin-left:-165px;border-radius:20px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px rgba(10,10,10,.08),0 0 0 .5px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;padding:0 18px}
.card .n{flex:1;font-weight:600;font-size:17px}.card .p{font-weight:600;font-size:17px}.card .p small{font-size:13px;color:var(--l3);font-weight:500}
.card .d{font-size:13px;color:var(--l3);font-weight:500;display:block;margin-top:2px}
.stamp{position:absolute;pointer-events:none;color:var(--acc);font-weight:800;letter-spacing:3px;font-size:30px;line-height:1;padding:7px 14px 6px;border:4px solid currentColor;border-radius:10px;transform:rotate(-9deg);filter:url(#rough);text-transform:uppercase;font-family:'Arial Black',Inter,sans-serif;mix-blend-mode:multiply}
/* 2 pick */
.search{height:44px;border-radius:12px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ph);font-size:17px;margin-top:20px;flex:none}
.chips{display:flex;gap:8px;margin:12px -24px 0;padding:0 24px;overflow:hidden;flex:none}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-weight:600;font-size:15px;display:flex;align-items:center;white-space:nowrap}
.chip.on{background:var(--l);color:#fff}
.list{margin-top:12px;overflow:hidden;flex:1;min-height:0}
.row{display:flex;align-items:center;gap:14px;height:60px;border-bottom:.5px solid var(--sep)}
.row .n{flex:1;font-weight:600;font-size:17px}.row .s{display:block;font-weight:400;font-size:15px;color:var(--l3);margin-top:1px}
.tick{width:26px;height:26px;border-radius:13px;border:2px solid #C7C7CC;flex:none;display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--accFill);border-color:var(--accFill)}
.sticky{margin:0 -24px;padding:12px 24px 0;border-top:.5px solid var(--sep);background:#fff}
.sum{display:flex;justify-content:space-between;font-size:15px;margin-bottom:12px}.sum b{font-weight:600}
/* 3 total */
.rcpt .r{display:flex;align-items:center;gap:14px;height:50px}
.rcpt .r img{width:34px;height:34px;border-radius:8px}
.rcpt .r .n{flex:1;font-weight:500;font-size:17px}.rcpt .r .a{font-weight:600;font-size:17px}.rcpt .r .a small{font-size:13px;color:var(--l3);font-weight:500}
.rule{height:1.5px;background:var(--l);margin:8px 0 16px}
.eyebrow{font-size:17px;color:var(--l3);font-weight:500}
.display{font-size:68px;line-height:72px;font-weight:700;letter-spacing:-2px}
/* 4 dates */
.svc{display:flex;align-items:center;gap:14px;margin-top:22px}
.svc .logo{width:56px;height:56px;border-radius:13px}
.svc .n{font-weight:700;font-size:20px}.svc .s{font-size:15px;color:var(--l3);margin-top:2px}
.edit{margin-left:auto;height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.grid div{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:17px;background:var(--surface)}
.grid div.on{background:var(--l);color:#fff;font-weight:600}
.conf{margin-top:14px;font-size:15px;color:var(--l2);display:flex;align-items:center;gap:8px;min-height:22px}
.conf b{color:var(--l);font-weight:600}
/* 5 reminders */
.lock{margin:26px -4px 0;border-radius:28px;background:linear-gradient(165deg,#2F4A5E,#16242F);padding:22px 12px 16px;position:relative}
.lock .t{text-align:center;color:#fff;font-weight:700;font-size:58px;line-height:1;letter-spacing:-1px;text-shadow:0 1px 8px rgba(0,0,0,.08)}
.lock .dd{text-align:center;color:#fff;font-weight:600;font-size:16px;margin-bottom:6px}
.note{margin-top:8px;background:rgba(255,255,255,.78);backdrop-filter:blur(20px);border-radius:20px;padding:11px 13px;display:flex;gap:10px}
.note .ai{width:36px;height:36px;border-radius:8px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.note .h{display:flex;justify-content:space-between;font-size:15px;font-weight:600}.note .h span{font-weight:400;color:#6E6E73;font-size:13px}
.note .m{font-size:15px;line-height:20px;color:#1c1c1e}
/* 6 paywall */
.x{position:absolute;right:16px;top:58px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;z-index:4}
.x span{width:30px;height:30px;border-radius:15px;background:var(--fill);display:flex;align-items:center;justify-content:center}
.plans{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.plan{height:64px;border-radius:16px;background:var(--surface);display:flex;align-items:center;padding:0 16px;gap:12px;border:2px solid transparent}
.plan.on{background:#fff;border-color:var(--l)}
.plan .nm{font-weight:600;font-size:17px;flex:1;display:flex;align-items:center;gap:8px}
.plan .pr{text-align:right;font-weight:600;font-size:17px}.plan .pr small{display:block;font-weight:400;font-size:13px;color:var(--l3);margin-top:2px}
.pill{font-size:13px;font-weight:600;color:var(--acc);background:var(--tint);padding:3px 8px;border-radius:10px;white-space:nowrap}
.tl{margin-top:16px;background:var(--surface);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;position:relative}
.tl .st{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:20px;color:var(--l2)}
.tl .st b{color:var(--l);font-weight:600}
.dot{width:22px;height:22px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 0 0 1.5px var(--sep)}
.dot.k{background:var(--l);box-shadow:none}
.dchip{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:8px;padding:1px 7px;box-shadow:0 0 0 1px var(--sep);font-weight:600;color:var(--l)}
.legal{display:flex;justify-content:center;gap:2px;font-size:13px;color:var(--l3)}.legal span{padding:0 8px;height:28px;display:flex;align-items:center}
/* 7 pick3 */
.badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:var(--tint);color:var(--acc);font-weight:600;font-size:15px}
.bell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px}
.bell span{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--fill)}
.bell.on span{background:var(--accFill)}
/* 8 done */
.check{width:72px;height:72px;border-radius:36px;background:var(--tint);display:flex;align-items:center;justify-content:center;margin-top:40px}
.srows{margin-top:28px;background:var(--surface);border-radius:20px;padding:4px 18px}
.srow{display:flex;align-items:center;gap:14px;min-height:64px;border-bottom:.5px solid var(--sep);padding:10px 0}
.srow:last-child{border:0}
.srow .k{font-size:15px;color:var(--l3)}.srow .v{font-weight:600;font-size:17px;margin-top:2px}
/* 9 ditch moment */
.dsheet{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-end}
.dpanel{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:14px 24px 34px;text-align:center}
.grab{width:36px;height:5px;border-radius:3px;background:#D1D1D6;margin:0 auto 18px}
.home-h{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.big{font-size:40px;line-height:44px;font-weight:700;letter-spacing:-1px}
/* anim */
@media (prefers-reduced-motion:no-preference){
 .anim .card{animation:cin .5s var(--ease) both}
 .anim .stamp.w{animation:stamp .34s cubic-bezier(.2,1.4,.4,1) 1.15s both}
 .anim .rcpt .r{animation:rin .32s var(--ease) both}
}
@keyframes cin{from{opacity:0;transform:translateY(16px)}}
@keyframes rin{from{opacity:0;transform:translateY(8px)}}
@keyframes stamp{from{opacity:0;transform:rotate(-9deg) scale(1.6)}to{opacity:1;transform:rotate(-9deg) scale(1)}}
.nav{position:fixed;left:0;right:0;bottom:0;display:none}
body.proto .stage{min-height:100vh;align-items:center}
body.proto .cap{display:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 1 1 1 1 1 1 .2 1 1"/></feComponentTransfer></filter></svg>
<div class="stage" id="stage"></div>
<script>
const L='../../assets/logos/';
const SUBS=[
 {id:'chatgpt-plus',n:'ChatGPT Plus',m:'20.00',y:'240.00',day:21,date:'Sat, Nov 21'},
 {id:'netflix',n:'Netflix',m:'17.99',y:'215.88',day:14,date:'Sat, Nov 14'},
 {id:'amazon-prime',n:'Amazon Prime',m:'14.99',y:'179.88',day:3,date:'Thu, Dec 3'},
 {id:'youtube-premium',n:'YouTube Premium',m:'13.99',y:'167.88',day:27,date:'Fri, Nov 27'},
 {id:'spotify',n:'Spotify',m:'11.99',y:'143.88',day:16,date:'Mon, Nov 16'},
 {id:'disney-plus',n:'Disney+',m:'11.99',y:'143.88',day:18,date:'Wed, Nov 18'}];
const img=(id,c='logo')=>`<img class="${c}" src="${L}${id}.png" alt="">`;
const chev=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#3C3C43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ck=(c='#fff',s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const bellI=(c='#fff')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15L6 16z" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 004 0" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;
const sb=`<div class="sb"><span>9:41</span><div class="isl"></div><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0A0A0A"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#0A0A0A"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#0A0A0A"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0A0A0A"/></svg><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#0A0A0A" opacity=".4" fill="none"/><rect x="2.5" y="2.5" width="18" height="8" rx="2" fill="#0A0A0A"/><rect x="24" y="4.5" width="1.5" height="4" rx=".7" fill="#0A0A0A" opacity=".4"/></svg></span></div>`;
const prog=n=>`<div class="top"><button class="back" aria-label="Back" data-go="-1">${chev}</button><div class="prog">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div></div>`;

const S=[];
// 1 Welcome
S.push({cap:'1 · Welcome',html:`
<div class="scr">
 <div class="deck">
  ${[['spotify','Spotify','11.99','Mon, Nov 16',40,-2.5,1],['netflix','Netflix','17.99','Sat, Nov 14',134,2,.45],['chatgpt-plus','ChatGPT Plus','20.00','Sat, Nov 21',228,-1.5,1]].map((c,i)=>`<div class="card" style="top:${c[4]}px;animation-delay:${.15+i*.12}s;transform:rotate(${c[5]}deg)"><span style="opacity:${c[6]};display:flex;align-items:center;gap:14px;flex:1">${img(c[0])}<span class="n">${c[1]}<span class="d">${c[3]}</span></span><span class="p money">$${c[2]}<small>/mo</small></span></span></div>`).join('')}
  <div class="stamp w" style="left:118px;top:142px;font-size:36px">Ditched</div>
 </div>
 <h1 class="title" style="font-size:34px;line-height:40px;margin-top:auto">Ditch it before<br>it renews.</h1>
 <p class="body">See everything you pay for, and get a heads-up before each charge.</p>
 <div class="foot" style="margin-top:32px"><button class="cta" data-go="1">See what I pay</button><p class="fine" style="margin:10px 0 0">Free forever for tracking · Your list stays on your phone</p></div>
</div>`});
// 2 Pick
S.push({cap:'2 · What do you pay for?',html:`
<div class="scr" style="padding-bottom:0">${prog(1)}
 <h1 class="title">What do you pay for?</h1>
 <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="#8E8E93" stroke-width="2.2"/><path d="M16 16l4 4" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"/></svg>Search 44 services</div>
 <div class="chips"><span class="chip on">Popular</span><span class="chip">Streaming</span><span class="chip">Music</span><span class="chip">AI</span><span class="chip">Shopping</span></div>
 <div class="list">${[['netflix','Netflix','17.99',1],['spotify','Spotify','11.99',1],['chatgpt-plus','ChatGPT Plus','20.00',1],['amazon-prime','Amazon Prime','14.99',1],['youtube-premium','YouTube Premium','13.99',1],['disney-plus','Disney+','11.99',1],['max','Max','16.99',0],['hulu','Hulu','9.99',0],['apple-music','Apple Music','10.99',0]].map(r=>`<div class="row">${img(r[0])}<div class="n">${r[1]}<span class="s money">about $${r[2]} a month</span></div><span class="tick ${r[3]?'on':''}">${r[3]?ck():''}</span></div>`).join('')}</div>
 <div class="sticky"><div class="sum"><b>6 picked</b><span class="money">about $1,091 a year</span></div><button class="cta" data-go="1">Continue</button><div style="height:34px"></div></div>
</div>`});
// 3 Total
S.push({cap:'3 · Your total',html:`
<div class="scr">${prog(2)}
 <h1 class="title">Here’s what you pay for</h1>
 <div class="rcpt" style="margin-top:14px">${SUBS.slice(0,5).map((s,i)=>`<div class="r" style="animation-delay:${.15+i*.09}s">${img(s.id,'')}<span class="n">${s.n}</span><span class="a money">$${s.y}<small> a year</small></span></div>`).join('')}
  <div class="r" style="animation-delay:.6s;height:36px"><span class="n" style="color:var(--l3);font-size:15px">+ Disney+</span><span class="a money" style="font-size:15px;color:var(--l3);font-weight:500">$143.88</span></div></div>
 <div class="rule"></div>
 <div class="eyebrow">That’s about</div>
 <div style="display:flex;align-items:baseline;gap:10px"><span class="display money">$1,091</span><span style="font-size:22px;font-weight:700">a year</span></div>
 <p class="body" style="margin-top:6px"><span class="money" style="color:var(--l);font-weight:600">$90.95 a month</span> across 6 subscriptions.</p>
 <div class="foot"><p class="body" style="margin:0 0 16px;color:var(--l)">Let’s make sure none of it surprises you.</p><button class="cta" data-go="1">Set my charge dates</button></div>
</div>`});
// 4 Dates
const days=Array.from({length:31},(_,i)=>i+1);
S.push({cap:'4 · Charge dates',html:`
<div class="scr">${prog(3)}
 <div style="display:flex;justify-content:space-between;align-items:baseline"><h1 class="title">When does it charge?</h1></div>
 <p class="body" style="margin-top:8px">Check your last receipt or bank app. Close is fine.</p>
 <div class="svc">${img('netflix')}<div><div class="n">Netflix</div><div class="s">2 of 6</div></div><span class="edit money">$17.99 a month <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L19 9l-4-4L4 16v4z" stroke="#3C3C43" stroke-width="2.4" stroke-linejoin="round"/></svg></span></div>
 <div class="grid">${days.map(d=>`<div class="${d===14?'on':''}">${d}</div>`).join('')}</div>
 <div class="conf">${ck('#0B7A6E',16)}<span>Next charge <b>Sat, Nov 14</b>. Then the 14th every month.</span></div>
 <div class="foot"><button class="cta" data-go="1">Next: Amazon Prime</button><div style="display:flex;gap:8px"><button class="sec">Not sure</button><button class="sec">Skip for now</button></div></div>
</div>`});
// 5 Reminders
S.push({cap:'5 · Reminders',html:`
<div class="scr">${prog(4)}
 <h1 class="title">We’ll tell you before every charge.</h1>
 <p class="body">3 days and 1 day before, at 9 AM. That’s all we send.</p>
 <div class="lock"><div class="dd">Wednesday, November 11</div><div class="t">9:00</div>
  <div class="note"><span class="ai">${img('netflix','logo').replace('class="logo"','style="width:36px;height:36px;border-radius:8px"')}</span><div style="flex:1"><div class="h">Ditch<span>now</span></div><div class="m money">Netflix renews Saturday. $17.99. Still watching?</div></div></div>
  <div class="note" style="opacity:.92"><span class="ai">${img('chatgpt-plus','logo').replace('class="logo"','style="width:36px;height:36px;border-radius:8px"')}</span><div style="flex:1"><div class="h">Ditch<span>Nov 18</span></div><div class="m money">ChatGPT Plus renews in 3 days. $20.00.</div></div></div>
 </div>
 <div class="foot"><button class="cta" data-go="1">Turn on reminders</button><button class="sec" data-go="1">Maybe later</button></div>
</div>`});
// 6 Paywall
S.push({cap:'6 · Paywall',html:`
<div class="scr" style="padding-top:62px">
 <div class="x"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#3C3C43" stroke-width="3" stroke-linecap="round"/></svg></span></div>
 <div style="display:flex;margin-top:4px">${SUBS.map((s,i)=>`<img src="${L}${s.id}.png" style="width:34px;height:34px;border-radius:8px;box-shadow:0 0 0 2px #fff;margin-left:${i?-8:0}px">`).join('')}</div>
 <h1 class="title" style="margin-top:14px">Get a heads-up before all 6 renewals.</h1>

const stage=document.getElementById('stage');
const q=new URLSearchParams(location.search);
const only=q.get('s');
function phone(i){return `<div class="cell"><div class="phone ${q.has('anim')?'anim':''}">${sb}${S[i].html}<div class="hi"></div></div><div class="cap">${S[i].cap}</div></div>`}
if(only!==null){stage.innerHTML=phone(+only)}
else if(q.has('board')){document.body.classList.add('board');stage.innerHTML=S.map((_,i)=>phone(i)).join('')}
else{ // clickable prototype
 document.body.classList.add('proto');let cur=0;
 const draw=()=>{stage.innerHTML=phone(cur).replace('class="phone ','class="phone anim ');stage.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cur=Math.max(0,Math.min(S.length-1,cur+ +b.dataset.go));draw()})};
 draw();
}
