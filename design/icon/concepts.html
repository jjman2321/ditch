<!doctype html><html><head><meta charset="utf-8">
<style>
body{margin:0;background:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#0A0A0A}
.wrap{padding:40px;width:1520px}
h2{font-size:22px;margin:0 0 6px}p{margin:0 0 24px;color:#6E6E73;font-size:15px}
.row{display:flex;gap:56px;align-items:flex-end;margin-bottom:40px}
.c{display:flex;flex-direction:column;align-items:center;gap:10px}
.c span{font-size:14px;font-weight:600}
.ic{border-radius:22.37%;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.ic svg,.ic img{display:block;width:100%;height:100%}
.home{background:linear-gradient(160deg,#cfd9e6,#9fb3c8);border-radius:28px;padding:28px;display:grid;grid-template-columns:repeat(6,60px);gap:26px 30px;width:max-content}
.home .ic{width:60px;height:60px}
.home .l{font-size:11px;color:#fff;text-align:center;margin-top:5px;width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="wrap">
<h2>Ditch duck icon concepts</h2>
<p>Hand-built vectors in the minimal line style. Teal is our accent. Daak shown for comparison.</p>
<div class="row" id="big"></div>
<div class="row" id="small"></div>
<div class="home" id="home"></div>
</div>

<path d="M330 880 C320 800 290 720 290 600 C290 410 420 270 600 270 C770 270 870 390 870 540" fill="none" stroke="#0A0A0A" stroke-width="52" stroke-linecap="round"/>

<script>
const daak='https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/PLACEHOLDER';
const C=[['A2','A · Swimmer, bolder'],['D2','D · Profile, bolder'],['D3','D + ditch water']];
function ic(id,size){const d=document.createElement('div');d.className='ic';d.style.width=d.style.height=size+'px';
 if(id==='daak'){const i=document.createElement('img');i.src='daak.png';d.appendChild(i)}else d.innerHTML=document.getElementById(id).innerHTML;return d}
const big=document.getElementById('big'),small=document.getElementById('small');
[...C,['daak','Daak (existing)']].forEach(([id,n])=>{const c=document.createElement('div');c.className='c';c.appendChild(ic(id,240));const s=document.createElement('span');s.textContent=n;c.appendChild(s);big.appendChild(c);
 const c2=document.createElement('div');c2.className='c';[60,40,29].forEach(z=>c2.appendChild(ic(id,z)));small.appendChild(c2);c2.style.width='240px'});
const home=document.getElementById('home');
[['rocket.png','Rocket Money'],['A2','Ditch A'],['bobby.png','Bobby'],['D2','Ditch D'],['ynab.png','YNAB'],['D3','Ditch D+'],['daak','Daak'],['A2','Ditch A'],['subpilot.png','Subpilot'],['orbit.png','Orbit'],['mono.png','MonoBoost'],['papaya.png','Papaya']].forEach(([id,n])=>{
 const w=document.createElement('div');let d;if(id.endsWith('.png')){d=document.createElement('div');d.className='ic';const i=document.createElement('img');i.src=id;d.appendChild(i)}else d=ic(id,60);w.appendChild(d);const l=document.createElement('div');l.className='l';l.textContent=n;w.appendChild(l);home.appendChild(w)});
</script></body></html>
