<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fill:#F2F2F7;--sep:#E5E5EA;--l:#0A0A0A;--l2:#3C3C43;--l3:#6E6E73;--acc:#0B7A6E;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}body{margin:0;zoom:2;background:#fff;font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;color:var(--l)}
.phone{width:390px;height:844px;padding:58px 24px 34px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;height:44px}
.back{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center}
.bar{flex:1;display:flex;gap:6px;margin-right:4px}.bar i{flex:1;height:4px;border-radius:2px;background:var(--fill)}.bar i.on{background:var(--l)}
h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.4px;margin:24px 0 20px;opacity:0;animation:in .4s var(--ease) .05s forwards}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;height:52px;opacity:0;transform:translateY(10px);animation:in .32s var(--ease) forwards}
.row img{width:36px;height:36px;border-radius:8px;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.row .n{flex:1;font-size:17px;font-weight:600}.row .a{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.row .a small{font-size:13px;color:var(--l3);font-weight:500}
.rule{height:1px;background:var(--l);margin:10px 0 18px;transform-origin:left;transform:scaleX(0);animation:draw .35s var(--ease) .95s forwards}
.totalrow{display:flex;align-items:baseline;justify-content:space-between}
.lbl{font-size:17px;font-weight:600;color:var(--l3)}
.num{font-size:64px;line-height:68px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;display:flex;align-items:flex-start}
.num{opacity:0;animation:fade .25s ease 1.15s forwards}.num .d{display:block;height:68px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.num .col{display:flex;flex-direction:column;transform:translateY(0)}
.num .col span{height:68px;display:block}
.yr{font-size:20px;font-weight:700;letter-spacing:-.2px;margin-left:4px;align-self:flex-end;margin-bottom:10px;opacity:0;animation:fade .3s ease 1.9s forwards}
.sub{font-size:17px;line-height:24px;color:var(--l2);margin:14px 0 0;opacity:0;animation:in .4s var(--ease) 2.05s forwards}
.sub b{color:var(--l);font-weight:600}
.spacer{flex:1}
.cta{height:56px;border-radius:28px;background:var(--l);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center}
@keyframes in{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes draw{to{transform:scaleX(1)}}
</style></head><body>
<div class="phone">
 <div class="top"><div class="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#3C3C43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="bar"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div></div>
 <h1>Here’s what you pay for</h1>
 <div class="list" id="list"></div>
 <div class="rule"></div>
 <div class="totalrow"><span class="lbl">Every year</span><div style="display:flex"><div class="num" id="num"></div></div></div>
 <p class="sub"><b>$90.95 a month.</b> We’ll remind you before each one charges, so nothing renews by surprise.</p>
 <div class="spacer"></div>
 <div class="cta">Set my charge dates</div>
</div>
<script>
const L=new URL('../../../assets/logos/',location.href).pathname;
const rows=[['chatgpt-plus','ChatGPT Plus','240.00'],['netflix','Netflix','215.88'],['amazon-prime','Amazon Prime','179.88'],['youtube-premium','YouTube Premium','167.88'],['spotify','Spotify','143.88'],['disney-plus','Disney+','143.88']];
const list=document.getElementById('list');
rows.forEach((r,i)=>{const d=document.createElement('div');d.className='row';d.style.animationDelay=(0.18+i*0.1)+'s';d.innerHTML=`<img src="file://${L}${r[0]}.png"><span class="n">${r[1]}</span><span class="a">$${r[2]}<small> /yr</small></span>`;list.appendChild(d)});
const final='$1,091';const num=document.getElementById('num');const cols=[];
[...final].forEach((ch)=>{if(/\d/.test(ch)){const w=document.createElement('span');w.className='d';const c=document.createElement('span');c.className='col';let s='';for(let k=0;k<20;k++)s+=`<span>${k%10}</span>`;c.innerHTML=s;w.appendChild(c);num.appendChild(w);cols.push([c,10+ +ch])}else{const s=document.createElement('span');s.textContent=ch;num.appendChild(s)}});
setTimeout(()=>{cols.forEach(([c,t],i)=>{c.style.transition=`transform ${0.85+i*0.08}s cubic-bezier(.23,1,.32,1)`;c.style.transform=`translateY(-${t*68}px)`})},1150);
</script></body></html>
