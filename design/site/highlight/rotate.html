<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@font-face{font-family:D;src:url('../../../assets/fonts/ArchivoDitch-Display.ttf')}
body{margin:0;background:#FFCC2E;font-family:-apple-system,sans-serif;color:#16140F}
.wrap{padding:72px 64px}@media(max-width:600px){.wrap{padding:56px 20px}}
h1{font-family:D;font-weight:400;font-size:clamp(46px,7vw,96px);line-height:.95;letter-spacing:-.03em;margin:0}
.slot{display:inline-flex;vertical-align:bottom;height:1.04em;overflow:hidden;position:relative;top:.06em}
.reel{display:flex;flex-direction:column;align-items:flex-start;animation:spin 10s cubic-bezier(.65,0,.35,1) infinite}
.chip{height:.96em;margin-bottom:.08em;display:inline-flex;align-items:center;gap:.14em;background:#fff;border-radius:.18em;padding:0 .16em 0 .1em;box-shadow:0 .05em 0 rgba(22,20,15,.18);white-space:nowrap;box-sizing:border-box}
.chip img{width:.72em;height:.72em;border-radius:.17em}
@keyframes spin{0%,16%{transform:translateY(0)}20%,36%{transform:translateY(-1.04em)}40%,56%{transform:translateY(-2.08em)}60%,76%{transform:translateY(-3.12em)}80%,96%{transform:translateY(-4.16em)}100%{transform:translateY(-5.2em)}}
@media (prefers-reduced-motion:reduce){.reel{animation:none}}
p{font-size:21px;line-height:1.45;color:#4B4220;max-width:34rem;margin:28px 0 0}
</style></head><body><div class="wrap">
<h1>Ditch <span class="slot" aria-hidden="true"><span class="reel">
<span class="chip"><img src="../../../assets/logos/netflix.png">Netflix</span>
<span class="chip"><img src="../../../assets/logos/spotify.png">Spotify</span>
<span class="chip"><img src="../../../assets/logos/chatgpt-plus.png">ChatGPT</span>
<span class="chip"><img src="../../../assets/logos/disney-plus.png">Disney+</span>
<span class="chip"><img src="../../../assets/logos/amazon-prime.png">Prime</span>
<span class="chip"><img src="../../../assets/logos/netflix.png">Netflix</span>
</span></span><br><span class="sr" style="position:absolute;left:-9999px">it</span> before it renews.</h1>
<p>Ditch keeps every subscription in one list and reminds you 3 days before each charge. No bank login, no account.</p>
</div></body></html>
