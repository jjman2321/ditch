<!doctype html>
<html><head><meta charset="utf-8"><title>Paywall v20</title>
<style>
@font-face{font-family:Archivo;src:url(../v12/fonts/archivo-wdth.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_700Bold.ttf);font-weight:700}
*{box-sizing:border-box;margin:0}
body{background:#E7E2D6;font-family:Inter,sans-serif;letter-spacing:-.2px;-webkit-font-smoothing:antialiased;padding:36px 40px}
.row{display:flex;gap:44px;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px}
.cap{font:800 20px Archivo;font-stretch:115%;color:#16140F}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #121110,0 30px 60px rgba(40,30,0,.2);display:flex;flex-direction:column;position:relative;
  --bg:#FBF7EE;--fg:#16140F;--fg2:#5A544A;--card:#fff;--line:#D9D0BD;--accent:#16140F;--accentFg:#fff;--chip:#FFF1BC;--chipFg:#16140F;--tick:#16140F;--tickFg:#FFCC2E;background:var(--bg);color:var(--fg)}
.phone.dark{--bg:#12110E;--fg:#F6F0E3;--fg2:#BFB7A7;--card:#1E1C18;--line:#3A3630;--accent:#FFCC2E;--accentFg:#16140F;--chip:#332B12;--chipFg:#FFCC2E;--tick:#FFCC2E;--tickFg:#16140F}
.sb{height:47px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font:600 16px Inter}
.bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}
.x{width:36px;height:36px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line) inset}
.restore{height:36px;padding:0 14px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;display:flex;align-items:center;font:600 14px Inter}
.icon{width:40px;height:40px;border-radius:11px;background:#FFCC2E;overflow:hidden;position:relative}
.icon img{position:absolute;width:48px;left:-4px;top:7px}
.eyebrow{font:600 15px Inter;color:var(--fg2);padding:8px 24px 0}
.title{font:900 29px/34px Archivo;font-stretch:125%;letter-spacing:-1px;padding:4px 24px 0}
.stats{display:flex;gap:10px;padding:16px 24px 0}
.stat{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px var(--line) inset}
.si{width:28px;height:28px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font:800 14px Inter;color:var(--chipFg)}
.sv{font:900 26px/30px Archivo;font-stretch:115%;margin-top:8px;letter-spacing:-.6px}
.sl{font:400 13px/17px Inter;color:var(--fg2);margin-top:2px}
.bens{padding:16px 24px 0;display:flex;flex-direction:column;gap:12px}
.ben{display:flex;gap:12px}
.ck{width:24px;height:24px;border-radius:12px;background:var(--tick);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.ben b{display:block;font:700 16px/21px Inter}
.ben span{display:block;font:400 14px/19px Inter;color:var(--fg2);margin-top:1px}
.grow{flex:1}
.panel{padding:0 20px 26px}
.plan{position:relative;height:54px;background:var(--card);box-shadow:0 0 0 1.5px var(--line) inset;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 16px;margin-top:9px}
.plan.on{box-shadow:0 0 0 2.5px var(--accent) inset}
.radio{width:22px;height:22px;border-radius:11px;box-shadow:0 0 0 2px var(--line) inset;flex:none}
.on .radio{box-shadow:none;background:var(--accent);display:flex;align-items:center;justify-content:center}
.nm{flex:1}.nm b{font:600 16px Inter;display:flex;align-items:center;gap:8px}.nm small{display:block;font:400 13px Inter;color:var(--fg2)}
.tag{background:#FFCC2E;color:#16140F;border-radius:8px;padding:2px 7px;font:700 12px Inter}
.pr{text-align:right}.pr b{display:block;font:900 18px/22px Archivo;font-stretch:115%}.pr small{font:400 13px Inter;color:var(--fg2)}
.rib{position:absolute;top:-10px;left:48px;background:var(--accent);color:var(--accentFg);border-radius:10px;padding:0 8px;height:20px;font:700 11px/20px Inter;letter-spacing:.4px}
.cta{margin-top:12px;height:58px;border-radius:30px;background:var(--accent);color:var(--accentFg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cta b{font:700 17px Inter}.cta small{font:500 13px Inter;opacity:.75;margin-top:1px}
.fine{text-align:center;font:400 12.5px/17px Inter;color:var(--fg2);margin-top:10px}
.fine u{color:var(--fg)}
</style></head><body>
<template id="screen">
 <div class="sb"><span>9:41</span><span>●●● ▮</span></div>
 <div class="bar"><span class="x"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span class="icon"><img src="../v12/duck.png"></span><span class="restore">Restore</span></div>
 <div class="eyebrow">Ditch Pro</div>
 <h1 class="title">Ditch it before<br>it renews.</h1>
 <div class="stats">
  <div class="stat"><div class="si">$</div><div class="sv">$1,091</div><div class="sl">a year on your 6 subscriptions</div></div>
  <div class="stat"><div class="si"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/></svg></div><div class="sv">4</div><div class="sl">renew in the next 30 days</div></div>
 </div>
 <div class="bens">
  <div class="ben"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--tickFg)" stroke-width="4"><path d="M5 12l5 5 9-10"/></svg></span><div><b>A heads-up before every charge.</b><span>On all 6, not just 3. Days before, your pick.</span></div></div>
  <div class="ben"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--tickFg)" stroke-width="4"><path d="M5 12l5 5 9-10"/></svg></span><div><b>Catch sneaky price rises.</b><span>We tell you when your plan costs more.</span></div></div>
  <div class="ben"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--tickFg)" stroke-width="4"><path d="M5 12l5 5 9-10"/></svg></span><div><b>No surprise yearly charges.</b><span>A month's warning, with time to cancel.</span></div></div>
 </div>
 <div class="grow"></div>
 <div class="panel">
  <div class="plan"><span class="radio"></span><span class="nm"><b>Weekly</b></span><span class="pr"><b>$6.99/wk</b><small>No free trial</small></span></div>
  <div class="plan on" style="margin-top:13px"><span class="rib">SAVE 86%</span><span class="radio"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accentFg)" stroke-width="4"><path d="M5 12l5 5 9-10"/></svg></span><span class="nm"><b>Yearly <span class="tag">7 days free</span></b></span><span class="pr"><b>$49.99/yr</b><small>$0.97 a week</small></span></div>
  <div class="plan"><span class="radio"></span><span class="nm"><b>Lifetime</b><small>Pay once. No subscription.</small></span><span class="pr"><b>$99.99</b><small>one time</small></span></div>
  <div class="cta"><b>Start 7-day free trial</b><small>$0 today · Cancel anytime</small></div>
  <div class="fine">Then $49.99/yr from Nov 25. Cancel anytime in Settings. <u>Terms</u> · <u>Privacy</u></div>
 </div>
</template>
<div class="row">
 <div class="cell"><div class="cap">Light</div><div class="phone" id="a"></div></div>
 <div class="cell"><div class="cap">Dark</div><div class="phone dark" id="b"></div></div>
</div>
<script>for (const id of ['a','b']) document.getElementById(id).append(document.getElementById('screen').content.cloneNode(true));</script>
</body></html>
