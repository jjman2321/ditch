<!doctype html>
<html><head><meta charset="utf-8"><title>Welcome v26</title>
<style>
@font-face{font-family:Archivo;src:url(../v12/fonts/archivo-wdth.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_700Bold.ttf);font-weight:700}
:root{--sun:#FFCC2E;--ink:#16140F;--cream:#FBF7EE;--fg2:#5E584B}
*{box-sizing:border-box;margin:0}
body{background:#E4DFD3;font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:32px 36px}
.row{display:flex;gap:40px;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:14px}
.cap{font:800 19px Archivo;font-stretch:112%;text-align:center}
.cap small{display:block;font:500 13.5px/18px Inter;color:#4A463E;margin-top:4px;max-width:380px}
.phone{width:var(--w,390px);height:var(--h,844px);border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #121110,0 30px 60px rgba(40,30,0,.2);background:var(--cream);display:flex;flex-direction:column;position:relative}
.sb{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 32px 0 36px;font:600 16px Inter;position:relative;z-index:5}
.sb i{display:flex;gap:5px;align-items:center}
.sb i b{display:block;background:var(--ink);border-radius:2px}
/* app tile */
.t{position:absolute;border-radius:24%;overflow:hidden;box-shadow:0 0 0 .5px rgba(22,20,15,.10),0 6px 16px rgba(58,42,0,.12),0 1px 3px rgba(58,42,0,.08)}
.t img{display:block;width:100%;height:100%}
.copy{text-align:center;padding:0 32px}
.h1{font:800 33px/37px Archivo;font-stretch:108%;letter-spacing:-.9px}
.sub{font:400 17px/24px Inter;color:var(--fg2);margin-top:12px;letter-spacing:-.2px}
.cta{margin:0 24px;height:56px;border-radius:28px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:600 17px Inter;letter-spacing:-.2px;flex:none}
.fine{text-align:center;font:500 13px Inter;color:var(--fg2);margin:14px 0 34px;flex:none}
.grow{flex:1}
.hl{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 92%,transparent 92%);padding:0 2px}
/* notification */
.note{background:rgba(255,255,255,.96);border-radius:20px;padding:12px 14px;display:flex;gap:11px;align-items:center;box-shadow:0 0 0 .5px rgba(22,20,15,.06),0 14px 34px rgba(58,42,0,.14),0 2px 6px rgba(58,42,0,.06)}
.ni{width:38px;height:38px;border-radius:9px;overflow:hidden;flex:none}
.ni img{width:100%;height:100%;display:block}
.nh{display:flex;justify-content:space-between;font:600 14px Inter;letter-spacing:-.15px}.nh span{font:400 12.5px Inter;color:#8A857A}
.nm{font:400 14.5px/19px Inter;margin-top:1px;letter-spacing:-.15px}
</style></head><body>
<div class="row" id="row"></div>
<script>
const SB=`<div class="sb"><span>9:41</span><i><b style="width:17px;height:11px;opacity:.9"></b><b style="width:25px;height:12px;border-radius:4px"></b></i></div>`;
const L=n=>`logos/${n}.png`;

function A(){ // constellation
  // positions relative to a 342-wide stage, centre at (171,150)
  const inner=['spotify','chatgpt-plus','disney-plus','apple-music','youtube-premium','netflix'];
  const outer=['hulu','headspace','dropbox','calm','canva-pro','audible'];
  const ring=[];
  inner.forEach((n,k)=>{const a=(-90+60*k)*Math.PI/180;ring.push([n,Math.round(Math.cos(a)*110),Math.round(Math.sin(a)*110),56,1]);});
  outer.forEach((n,k)=>{const a=(-60+60*k)*Math.PI/180;ring.push([n,Math.round(Math.cos(a)*142),Math.round(Math.sin(a)*128),38,.42]);});
  let t=ring.map(([n,x,y,s,o])=>`<span class="t" style="width:${s}px;height:${s}px;left:${171+x-s/2}px;top:${150+y-s/2}px;opacity:${o};${o<1?'filter:saturate(.7);box-shadow:none':''}"><img src="${L(n)}"></span>`).join('');
  return `<div class="phone">${SB}<div class="grow" style="flex:.6"></div>
   <div style="position:relative;height:300px;margin:0 24px;transform:scale(1.08)">${t}
    <span class="t" style="width:96px;height:96px;left:${171-48}px;top:${150-48}px;box-shadow:0 0 0 .5px rgba(22,20,15,.12),0 18px 40px rgba(58,42,0,.22),0 3px 8px rgba(58,42,0,.1)"><img src="app-icon.png"></span>
   </div>
   <div class="grow" style="flex:.5"></div>
   <div class="copy"><div class="h1">Every subscription.<br>One calm list.</div><div class="sub">See what you pay for, and get a reminder before each charge.</div></div>
   <div class="grow"></div>
   <div class="cta">Get started</div><div class="fine">Free to track. No account needed.</div></div>`;
}

function B(){ // reminder stack, Apple-style
  const n=(logo,title,time,msg)=>`<div class="note"><span class="ni"><img src="${logo}"></span><div style="flex:1;min-width:0"><div class="nh">${title}<span>${time}</span></div><div class="nm">${msg}</div></div></div>`;
  return `<div class="phone" style="background:linear-gradient(180deg,#FFD84F 0%,#FFE48A 42%,var(--cream) 78%)">${SB}
   <div class="grow" style="flex:.6"></div>
   <div style="position:relative;margin:0 20px;height:300px">
     <img src="duck.png" style="position:absolute;width:118px;right:34px;top:2px">
     <div style="position:absolute;left:0;right:0;top:68px;z-index:3">${n('app-icon.png','Ditch','9:00 AM','Netflix renews in 3 days. $17.99. Still watching?')}</div>
     <div style="position:absolute;left:0;right:0;top:152px;z-index:2;transform:scale(.95);transform-origin:top;opacity:.92">${n('app-icon.png','Ditch','Yesterday','Your ChatGPT Plus trial ends tomorrow. $20 after.')}</div>
     <div style="position:absolute;left:0;right:0;top:228px;z-index:1;transform:scale(.90);transform-origin:top;opacity:.6">${n('app-icon.png','Ditch','Mon','Spotify went up to $12.99 a month.')}</div>
   </div>
   <div class="grow" style="flex:.5"></div>
   <div class="copy"><div class="h1">Ditch it before<br>it renews.</div><div class="sub">A reminder before every charge, so nothing renews by surprise.</div></div>
   <div class="grow"></div>
   <div class="cta">Get started</div><div class="fine">Free to track. No account needed.</div></div>`;
}

function C(){ // Headway-style: duck icon with fanned logo cards
  const cards=[['youtube-premium',0,-118,4,56],['netflix',-112,-50,-10,68],['spotify',112,-50,9,66],['chatgpt-plus',-98,76,7,60],['disney-plus',100,76,-7,62],['apple-music',0,122,-3,46]];
  const t=cards.map(([n,x,y,r,s])=>`<span class="t" style="width:${s}px;height:${s}px;left:${171+x-s/2}px;top:${150+y-s/2}px;transform:rotate(${r}deg)"><img src="${L(n)}"></span>`).join('');
  const spark=(x,y,s)=>`<svg style="position:absolute;left:${x}px;top:${y}px" width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z" fill="#FFB800"/></svg>`;
  return `<div class="phone">${SB}<div class="grow" style="flex:.6"></div>
   <div style="position:relative;height:300px;margin:0 24px;transform:scale(1.08)">
    <div style="position:absolute;left:${171-120}px;top:${150-120}px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#FFE58C 0%,rgba(255,229,140,.0) 70%)"></div>
    ${t}${spark(22,26,18)}${spark(300,18,14)}${spark(306,170,13)}${spark(18,236,15)}
    <span class="t" style="width:112px;height:112px;left:${171-56}px;top:${150-56}px;box-shadow:0 0 0 .5px rgba(22,20,15,.12),0 20px 44px rgba(58,42,0,.24),0 3px 8px rgba(58,42,0,.1)"><img src="app-icon.png"></span>
   </div>
   <div class="grow" style="flex:.5"></div>
   <div class="copy"><div class="h1">See every <span class="hl">subscription</span><br>you pay for.</div><div class="sub">Then get a reminder before each one renews.</div></div>
   <div class="grow"></div>
   <div class="cta">Get started</div><div class="fine">Free to track. No account needed.</div></div>`;
}
const opts=[['A · Icon constellation','Your app icon in the middle, real service icons around it, fading out at the edge. (Perplexity Health, Apple Health, Yazio.)',A],
 ['B · Reminder stack','Three real Ditch reminders stacked like the lock screen, the duck peeking over. Sunflower fades to cream. (Apple, One, Alan.)',B],
 ['C · Icon with fanned logos','Big Ditch icon on a soft glow, logos fanned around it, small sparkles, one highlighted word. (Headway, Recime.)',C]];
const sizes=(new URLSearchParams(location.search)).get('size');
document.getElementById('row').innerHTML=opts.map(([t,s,f])=>`<div class="cell"><div class="cap">${t}<small>${s}</small></div>${f()}</div>`).join('');
</script>
</body></html>
