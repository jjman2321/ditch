<!doctype html>
<html><head><meta charset="utf-8"><title>Bank sync screens v30</title>
<style>
@font-face{font-family:Archivo;src:url(../v12/fonts/archivo-wdth.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_400Regular.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_500Medium.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(../v12/fonts/Inter_700Bold.ttf);font-weight:700}
:root{--sun:#FFCC2E;--sunsoft:#FFF1BC;--ink:#16140F;--cream:#FBF7EE;--card:#fff;--fg2:#5A544A;--mute:#8A8375;--hair:#ECE5D6;--amber:#B45309;--red:#C2410C;--green:#15803D}
*{box-sizing:border-box;margin:0}
body{background:#E4DFD3;font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:28px 32px;letter-spacing:-.15px}
.grid{display:grid;grid-template-columns:repeat(4,390px);gap:34px 30px}
.cell{display:flex;flex-direction:column;gap:10px}
.cap{font:700 14px Inter;color:#3D392F}.cap small{display:block;font:500 12.5px/17px Inter;color:#6A655A;margin-top:2px}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 9px #121110,0 24px 50px rgba(40,30,0,.18);background:var(--cream);display:flex;flex-direction:column;position:relative}
.sb{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font:600 16px Inter}
.sb i{display:flex;gap:5px}.sb i b{display:block;background:var(--ink);border-radius:2px}
.pad{padding:0 20px}
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex:none}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font:500 24px Inter}
.h1{font:900 30px/34px Archivo;font-stretch:115%;letter-spacing:-.8px;text-wrap:balance}
.h2{font:900 22px/27px Archivo;font-stretch:112%;letter-spacing:-.5px}
.lead{font:400 16px/23px Inter;color:var(--fg2);margin-top:8px}
.eyebrow{font:700 11.5px Inter;letter-spacing:1.1px;text-transform:uppercase;color:var(--mute)}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 0 rgba(22,20,15,.04),0 6px 18px rgba(70,50,0,.06)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px}
.row+.row{border-top:1px solid var(--hair)}
.logo{width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 .5px rgba(22,20,15,.1)}
.logo img{width:100%;height:100%;display:block}
.bank{width:40px;height:40px;border-radius:10px;flex:none;background:#0F5BA7;color:#fff;display:flex;align-items:center;justify-content:center;font:800 17px Archivo}
.nm{font:600 16px Inter}.sub{font:400 13.5px/18px Inter;color:var(--mute);margin-top:1px}
.amt{font:800 16px Archivo;font-stretch:110%;font-variant-numeric:tabular-nums}
.btn{height:54px;border-radius:27px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:600 17px Inter;flex:none}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);height:44px;font-weight:600}
.btn.sm{height:40px;border-radius:20px;font-size:15px;padding:0 16px}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.fine{font:400 13px/18px Inter;color:var(--fg2);text-align:center}
.tick{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font:500 16px/22px Inter}
.tick span.c{width:24px;height:24px;border-radius:12px;background:var(--sun);display:flex;align-items:center;justify-content:center;font:800 14px Inter;flex:none;margin-top:-1px}
.tag{display:inline-block;font:800 9.5px Archivo;font-stretch:110%;letter-spacing:.6px;padding:2px 6px;border-radius:5px;background:var(--ink);color:var(--sun);vertical-align:2px;margin-left:6px}
.chip{display:inline-block;font:700 11px Inter;letter-spacing:.6px;padding:3px 8px;border-radius:6px;background:var(--sunsoft);color:#5C4700}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--cream);border-top:1px solid var(--hair);display:flex;justify-content:space-around;padding-top:10px;font:600 10.5px Inter;color:var(--mute)}
.tabbar b{display:block;width:22px;height:22px;margin:0 auto 4px;border-radius:6px;background:#CFC7B5}.tabbar .on{color:var(--ink)}.tabbar .on b{background:var(--ink)}
.total{background:var(--sun);border-radius:20px;padding:16px 18px}
.total .big{font:900 40px Archivo;font-stretch:118%;letter-spacing:-1.2px}
.total .big small{font:600 16px Inter;letter-spacing:0;margin-left:6px}
.toast{position:absolute;left:14px;right:14px;bottom:98px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.toast .u{color:var(--sun);font:700 15px Inter;padding:10px 4px}
.step{display:flex;gap:12px;align-items:center;padding:9px 0;font:500 16px Inter}
.step .d{width:24px;height:24px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font:800 13px Inter}
.step.done .d{background:var(--ink);color:var(--sun)}.step.now .d{box-shadow:inset 0 0 0 2.5px var(--ink)}.step.now .d::after{content:"";width:8px;height:8px;border-radius:4px;background:var(--ink)}
.step.todo{color:var(--mute)}.step.todo .d{box-shadow:inset 0 0 0 2px #D4CCBA}
.yn{display:flex;gap:8px;margin-top:10px}.yn .btn{flex:1}
.notice{border-radius:18px;padding:14px 16px;background:var(--card);box-shadow:0 6px 18px rgba(70,50,0,.06)}
.notice.warn{background:#FFF6E0;box-shadow:inset 0 0 0 1.5px #F2C14E}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:#E59E0B;margin-right:6px;vertical-align:1px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:22px 22px 0 0;padding:10px 20px 34px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.grab{width:36px;height:5px;border-radius:3px;background:#D6CEBC;margin:0 auto 14px}
.dim{position:absolute;inset:0;background:rgba(22,20,15,.35)}
.lockrow{display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const L=n=>`<span class="logo"><img src="../v26/logos/${n}.png"></span>`;
const SB=`<div class="sb"><span>9:41</span><i><b style="width:17px;height:11px"></b><b style="width:25px;height:12px;border-radius:4px"></b></i></div>`;
const TABS=(on)=>`<div class="tabbar">${['Home','Calendar','Ditched'].map(t=>`<div class="${t===on?'on':''}"><b></b>${t}</div>`).join('')}</div>`;
const S=[];
const add=(t,s,html)=>S.push(`<div class="cell"><div class="cap">${t}<small>${s}</small></div><div class="phone">${html}</div></div>`);

// a1 Where should we look
add('1 · Where should we look?','Bank row first, only for US/CA App Store accounts. Tag says it\'s Pro with 7 days free.',
`${SB}<div class="nav"><span class="back">‹</span><span></span></div>
<div class="pad"><div class="h1">Where should we look?</div><div class="lead">Pick one. You check everything before it's added.</div>
<div class="card" style="margin-top:20px">
 <div class="row"><span class="bank" style="background:var(--sun)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3.5 9.2L12 4l8.5 5.2H3.5z" stroke="#16140F" stroke-width="2" stroke-linejoin="round"/><path d="M6.5 12.5v4.5M10.5 12.5v4.5M13.5 12.5v4.5M17.5 12.5v4.5M3.5 20h17" stroke="#16140F" stroke-width="2" stroke-linecap="round"/></svg></span><div style="flex:1"><div class="nm">My bank or card</div><div class="sub">Finds them for you. US &amp; Canada.</div><div style="margin-top:6px"><span class="chip">PRO · 7 DAYS FREE</span></div></div><span style="color:var(--mute);font-size:20px">›</span></div>
 <div class="row"><span class="bank" style="background:#EFE8D8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="6" y="2.5" width="12" height="19" rx="2.8" stroke="#16140F" stroke-width="2"/><circle cx="9.4" cy="8.5" r="1" fill="#16140F"/><circle cx="9.4" cy="12" r="1" fill="#16140F"/><circle cx="9.4" cy="15.5" r="1" fill="#16140F"/><path d="M11.6 8.5h3M11.6 12h3M11.6 15.5h2" stroke="#16140F" stroke-width="1.8" stroke-linecap="round"/></svg></span><div style="flex:1"><div class="nm">Apple subscriptions</div><div class="sub">A screenshot of your list.</div><div style="margin-top:6px"><span class="chip" style="background:#EDE7DA;color:#5A544A">FREE ONCE</span></div></div><span style="color:var(--mute);font-size:20px">›</span></div>
 <div class="row"><span class="bank" style="background:#EFE8D8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M14 3H7.2A1.2 1.2 0 006 4.2v15.6A1.2 1.2 0 007.2 21h9.6a1.2 1.2 0 001.2-1.2V7l-4-4z" stroke="#16140F" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="#16140F" stroke-width="2" stroke-linejoin="round"/><path d="M9 11.5h6M9 14.5h6M9 17.5h3.5" stroke="#16140F" stroke-width="1.8" stroke-linecap="round"/></svg></span><div style="flex:1"><div class="nm">A bank statement</div><div class="sub">PDF or CSV from any bank.</div><div style="margin-top:6px"><span class="chip" style="background:#EDE7DA;color:#5A544A">FREE ONCE</span></div></div><span style="color:var(--mute);font-size:20px">›</span></div>
 <div class="row"><span class="bank" style="background:#EFE8D8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3.8 6.6l1.7 1.7 3-3.1M3.8 12.6l1.7 1.7 3-3.1" stroke="#16140F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="17.2" width="4" height="4" rx="1.2" stroke="#16140F" stroke-width="1.8"/><path d="M11.5 7h8.5M11.5 13h8.5M11.5 19.2h8.5" stroke="#16140F" stroke-width="2" stroke-linecap="round"/></svg></span><div style="flex:1"><div class="nm">Pick them myself</div><div class="sub">Tick them from our list.</div></div><span style="color:var(--mute);font-size:20px">›</span></div>
</div></div>`);

// a2 explainer
add('2 · Before the bank opens','What we read, what we can\'t do, how to stop. Price and trial shown before the bank, never after.',
`${SB}<div class="nav"><span class="back">‹</span><span></span></div>
<div class="pad" style="flex:1;display:flex;flex-direction:column"><div class="h1" style="font-size:34px;line-height:37px">Your bank<br>already knows.</div>
<div class="lead">Connect it once. Ditch finds what you pay for and keeps an eye out for new ones.</div>
<div style="margin-top:22px">
 <div class="tick"><span class="c">✓</span><span>Read-only. Ditch can't move money.</span></div>
 <div class="tick"><span class="c">✓</span><span>You sign in with your bank. We never see your password.</span></div>
 <div class="tick"><span class="c">✓</span><span>Disconnect any time in Settings.</span></div>
</div>
<div style="margin-top:6px;font:600 15px Inter;text-decoration:underline;text-underline-offset:3px">What we see</div>
<div style="flex:1"></div>
<div class="btn">Connect my bank</div>
<div class="btn ghost" style="margin-top:4px">Not now</div>
<div class="fine" style="margin:6px 0 30px">US &amp; Canada. Part of Pro: 7 days free, then $59.99/yr.</div></div>`);

// c scanning
add('3 · Reading your bank','Real steps that tick as they happen. No fake percent bar. "Keep going" appears at 20 seconds.',
`${SB}<div class="pad" style="flex:1;display:flex;flex-direction:column;padding-top:40px">
<span class="bank" style="width:56px;height:56px;border-radius:14px;font-size:24px">C</span>
<div class="h1" style="margin-top:18px">Reading Chase…</div>
<div style="margin-top:20px">
 <div class="step done"><span class="d">✓</span>Connected to Chase</div>
 <div class="step done"><span class="d">✓</span>Read the last 30 days</div>
 <div class="step now"><span class="d"></span>Going back further</div>
 <div class="step todo"><span class="d"></span>Matching charges to services</div>
</div>
<div class="card" style="margin-top:24px;padding:14px 16px"><div class="eyebrow">Found 4 so far</div><div style="display:flex;gap:8px;margin-top:10px">${['netflix','spotify','hulu','chatgpt-plus'].map(L).join('')}</div></div>
<div style="flex:1"></div>
<div class="fine">Usually under a minute.</div>
<div class="btn line" style="margin:12px 0 34px">Keep going</div></div>`);

// d results
add('4 · What we found','Sure ones are already added (untick to undo). Unsure ones need a Yes. Every row shows its real charge dates.',
`${SB}<div class="pad" style="flex:1;display:flex;flex-direction:column;padding-top:16px;overflow:hidden">
<div class="h1">Found 7 at Chase.</div><div class="lead" style="margin-top:4px">We added the 5 we're sure about. 2 need a yes or no.</div>
<div class="eyebrow" style="margin:16px 0 8px">Added</div>
<div class="card">
 ${[['netflix','Netflix','$17.99','Paid Oct 10, Nov 10'],['spotify','Spotify','$11.99','Paid Oct 26, Nov 26'],['chatgpt-plus','ChatGPT Plus','$20.00','Paid Oct 1, Nov 1']].map(([l,n,a,s])=>`<div class="row">${L(l)}<div style="flex:1;min-width:0"><div class="nm">${n}</div><div class="sub">${s}</div></div><span class="amt">${a}</span><span style="width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--sun);display:flex;align-items:center;justify-content:center;font:800 13px Inter">✓</span></div>`).join('')}
 <div class="row" style="min-height:44px;justify-content:center;color:var(--fg2);font:500 14px Inter">+ 2 more</div>
</div>
<div class="eyebrow" style="margin:16px 0 8px">Check these</div>
<div class="card" style="padding:12px 14px"><div style="display:flex;gap:12px;align-items:center">${L('patreon')}<div style="flex:1"><div class="nm">Patreon</div><div class="sub">$9.99 on Oct 3, Nov 3. Subscription?</div></div></div>
<div class="yn"><div class="btn sm">Yes</div><div class="btn sm line">No</div></div></div>
<div style="flex:1"></div>
<div class="btn" style="margin:12px 0 34px">Looks right</div></div>`);

// e1 home toast + found tag
add('5 · Home: a new one was added','Toast with Undo for 8 seconds. The row keeps a "FOUND IN YOUR BANK" tag for 7 days; Undo also lives on its detail screen.',
`${SB}<div class="pad" style="padding-top:6px"><div class="lockrow"><span style="font:900 28px Archivo;font-stretch:125%;letter-spacing:-1px">ditch</span><span style="display:flex;gap:8px"><span style="width:44px;height:44px;border-radius:22px;background:#EFE8D8"></span><span style="width:44px;height:44px;border-radius:22px;background:var(--ink);color:var(--sun);display:flex;align-items:center;justify-content:center;font:600 24px Inter">+</span></span></div>
<div class="total" style="margin-top:14px"><div class="big">$107.94<small>a month</small></div><div style="font:500 15px Inter;margin-top:8px;padding-top:8px;border-top:1px solid rgba(22,20,15,.15)">$1,295 a year · Reminders on all 7</div></div>
<div class="eyebrow" style="margin:18px 0 8px">Next week</div>
<div class="card">
 <div class="row">${L('max')}<div style="flex:1"><div class="nm">Max <span class="tag">FOUND IN YOUR BANK</span></div><div class="sub">Tue, Nov 24 · in 5 days</div></div><span class="amt">$16.99</span></div>
 <div class="row">${L('netflix')}<div style="flex:1"><div class="nm">Netflix</div><div class="sub">Thu, Nov 26</div></div><span class="amt">$17.99</span></div>
 <div class="row">${L('spotify')}<div style="flex:1"><div class="nm">Spotify</div><div class="sub">Sat, Nov 28</div></div><span class="amt">$11.99</span></div>
</div></div>
<div class="toast"><div style="flex:1;font:500 15px/20px Inter">Added Max from your bank. $16.99 a month.</div><span class="u">Undo</span></div>${TABS('Home')}`);

// e4 price change
add('6 · Home: the real bill changed','Never changed silently. Shows both real numbers and where they came from. One card at a time.',
`${SB}<div class="pad" style="padding-top:6px"><div class="lockrow"><span style="font:900 28px Archivo;font-stretch:125%;letter-spacing:-1px">ditch</span><span style="width:44px;height:44px;border-radius:22px;background:var(--ink)"></span></div>
<div class="total" style="margin-top:14px"><div class="big">$90.95<small>a month</small></div><div style="font:500 15px Inter;margin-top:8px;padding-top:8px;border-top:1px solid rgba(22,20,15,.15)">$1,091 a year · Reminders on all 6</div></div>
<div class="notice" style="margin-top:14px"><div style="display:flex;gap:12px">${L('netflix')}<div style="flex:1"><div style="font:700 16px/21px Inter">Netflix charged $17.99, not $15.49.</div><div class="sub" style="margin-top:2px">From your Nov 10 bill at Chase.</div></div></div>
<div class="yn"><div class="btn sm" style="flex:1.3">Update to $17.99</div><div class="btn sm line">Keep $15.49</div></div></div>
<div class="eyebrow" style="margin:18px 0 8px">Next week</div>
<div class="card"><div class="row">${L('netflix')}<div style="flex:1"><div class="nm">Netflix</div><div class="sub">Charged today ✓</div></div><span class="amt">$15.49</span></div>
<div class="row">${L('spotify')}<div style="flex:1"><div class="nm">Spotify</div><div class="sub">Thu, Nov 26</div></div><span class="amt">$11.99</span></div></div></div>${TABS('Home')}`);

// e5 looks cancelled
add('7 · Home: looks cancelled','After a missed date + 7 days. Never ditched without a tap. "Mark ditched" goes to the normal Ditched moment.',
`${SB}<div class="pad" style="padding-top:6px"><div class="lockrow"><span style="font:900 28px Archivo;font-stretch:125%;letter-spacing:-1px">ditch</span><span style="width:44px;height:44px;border-radius:22px;background:var(--ink)"></span></div>
<div class="total" style="margin-top:14px"><div class="big">$90.95<small>a month</small></div><div style="font:500 15px Inter;margin-top:8px;padding-top:8px;border-top:1px solid rgba(22,20,15,.15)">$1,091 a year · Reminders on all 6</div></div>
<div class="notice" style="margin-top:14px"><div style="display:flex;gap:12px">${L('hulu')}<div style="flex:1"><div style="font:700 16px/21px Inter">No Hulu charge since Oct 12.</div><div class="sub" style="margin-top:2px">It was due Nov 12. Cancelled?</div></div></div>
<div class="yn"><div class="btn sm">Mark ditched</div><div class="btn sm line">Still paying</div></div></div></div>${TABS('Home')}`);

// g reconnect
add('8 · Home: bank needs a sign-in','Calm, one tap, never hides the list. Reminders keep working. "Later" hides it for 3 days.',
`${SB}<div class="pad" style="padding-top:6px"><div class="lockrow"><span style="font:900 28px Archivo;font-stretch:125%;letter-spacing:-1px">ditch</span><span style="width:44px;height:44px;border-radius:22px;background:var(--ink)"></span></div>
<div class="notice warn" style="margin-top:14px"><div style="display:flex;gap:12px;align-items:flex-start"><span class="bank">C</span><div style="flex:1"><div style="font:700 16px/21px Inter">Chase needs you to sign in again.</div><div class="sub" style="margin-top:2px;color:#6B5A30">Banks do this every few months. Your list and reminders still work.</div></div></div>
<div class="yn"><div class="btn sm">Reconnect</div><div class="btn sm ghost" style="height:40px">Later</div></div></div>
<div class="total" style="margin-top:14px"><div class="big">$90.95<small>a month</small></div><div style="font:500 15px Inter;margin-top:8px;padding-top:8px;border-top:1px solid rgba(22,20,15,.15)">$1,091 a year · Reminders on all 6</div></div>
<div class="eyebrow" style="margin:18px 0 8px">Next week</div>
<div class="card"><div class="row">${L('netflix')}<div style="flex:1"><div class="nm">Netflix</div><div class="sub">Tue, Nov 24 · in 5 days</div></div><span class="amt">$17.99</span></div></div></div>${TABS('Home')}`);

// h settings bank connections
add('9 · Settings → Bank connections','Each bank\'s status in words. Disconnect in 2 taps. No "check now" (banks update a few times a day). 3-bank limit.',
`${SB}<div class="nav"><span class="back" style="font-size:16px;width:auto;padding:0 6px">‹ Settings</span><span></span></div>
<div class="pad"><div class="h1">Bank connections</div><div class="lead">Banks update a few times a day.</div>
<div class="card" style="margin-top:18px">
 <div class="row"><span class="bank">C</span><div style="flex:1"><div class="nm">Chase</div><div class="sub">Visa ••4821 · Checking ••1005</div><div class="sub" style="color:var(--green)">Checked 2 hours ago</div></div><span style="color:var(--mute);font-size:20px">›</span></div>
 <div class="row"><span class="bank" style="background:#1E3A8A">A</span><div style="flex:1"><div class="nm">American Express</div><div class="sub">Gold ••1005</div><div class="sub" style="color:var(--amber)"><span class="dot"></span>Needs sign-in</div></div><span style="color:var(--mute);font-size:20px">›</span></div>
</div>
<div class="card" style="margin-top:14px"><div class="row" style="font:600 16px Inter">＋&nbsp; Add a bank or card</div></div>
<div class="fine" style="text-align:left;margin-top:8px">Connect the card or bank that pays your subscriptions. Up to 3.</div>
<div style="margin-top:22px;font:600 15px Inter;text-decoration:underline;text-underline-offset:3px">What we see</div></div>
<div class="dim"></div><div class="sheet"><div class="grab"></div><div class="h2">Disconnect Chase?</div><div class="lead" style="margin-top:6px">Ditch stops checking Chase. Everything on your list stays.</div>
<div class="btn" style="margin-top:18px;background:var(--red)">Disconnect</div><div class="btn ghost" style="margin-top:4px">Cancel</div></div>`);
